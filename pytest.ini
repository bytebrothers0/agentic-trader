[pytest]
# The `live` marker gates opt-in tests that make a real model/network call. They
# are always skipped unless AGENT_LIVE_TEST=1, so `pytest -q` stays offline and
# green by default. Registering the marker here keeps `-W error` / strict-markers
# clean as well.
markers =
    live: opt-in, makes a real network/model call (requires AGENT_LIVE_TEST=1 and a resolved provider key)
